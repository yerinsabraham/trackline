name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Doctor
        run: npm run doctor

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (the scorers score themselves)
        run: npm test

      - name: Build CLI
        run: npm run build

      # Fixture mode: no network, no API keys, no spend, same numbers on every
      # runner. Safety metrics fail at anything above zero, with no tolerance.
      - name: Eval gate
        run: npm run evals -- --report=github

  # The live path was broken on Node 20 for months because nothing ran it. The
  # CLI is exercised as an installed binary under plain node, with a stub
  # config, on every supported major. No network and no API keys: the stub
  # retriever and tool selector return fixed values, so this checks that the
  # config loads and the runner wires it up, not that the numbers are good.
  live-path:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run build

      # Run against a scratch project with no baseline, so the gate has nothing
      # to compare against and a stub retriever returning nothing does not fail
      # the build. What is under test is that the config loads and the runner
      # wires it up, not the quality of the numbers.
      - name: Live run loads a JavaScript config
        run: |
          mkdir -p "$RUNNER_TEMP/smoke/datasets"
          cp datasets/*.jsonl "$RUNNER_TEMP/smoke/datasets/"
          cp harness.config.example.mjs "$RUNNER_TEMP/smoke/harness.config.mjs"
          node dist/run.js run --live --root="$RUNNER_TEMP/smoke"

      # Node 20 cannot strip types at all, and Node 22 only from 22.18. A .ts
      # config must therefore fail with our own advice rather than an
      # ERR_UNKNOWN_FILE_EXTENSION out of Node internals. Asserting on the
      # message is the point: a raw stack trace here is the bug.
      #
      # --no-experimental-strip-types only exists from Node 22.6, and Node 20
      # rejects the flag outright, so it is probed rather than assumed. Node 20
      # needs no flag: it cannot strip types under any circumstances.
      - name: TypeScript config reports something useful when it cannot load
        run: |
          mkdir -p "$RUNNER_TEMP/tsconf/datasets"
          cp datasets/*.jsonl "$RUNNER_TEMP/tsconf/datasets/"
          cp harness.config.example.ts "$RUNNER_TEMP/tsconf/harness.config.ts"

          NO_STRIP=""
          if node --no-experimental-strip-types -e "" >/dev/null 2>&1; then
            NO_STRIP="--no-experimental-strip-types"
          fi
          echo "node $(node -v), type stripping disabled via: ${NO_STRIP:-not needed}"

          # Guard the premise: if this Node can still strip types the assertions
          # below would be testing nothing, and passing would be meaningless.
          if node $NO_STRIP -e "process.exit(process.features.typescript ? 0 : 1)"; then
            echo "::error::could not disable type stripping, so this check proves nothing"
            exit 1
          fi

          set +e
          out=$(node $NO_STRIP dist/run.js run --live --root="$RUNNER_TEMP/tsconf" 2>&1)
          code=$?
          set -e
          echo "$out"
          [ "$code" -ne 0 ] || { echo "::error::an unloadable config must not exit 0"; exit 1; }
          echo "$out" | grep -q "cannot import it directly" \
            || { echo "::error::expected actionable advice, got a raw error"; exit 1; }
          if echo "$out" | grep -qi "ERR_UNKNOWN_FILE_EXTENSION"; then
            echo "::error::leaked the raw Node error instead of advice"
            exit 1
          fi

  # The Go engine. Separate job because it is a separate program with a separate
  # toolchain: the hook binary runs before every tool call on a developer's
  # machine, where the TypeScript gate runs once per merge in CI.
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt'd: $unformatted"
            exit 1
          fi

      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -race

      # The hook ships as a single file with no runtime to install. If a target
      # stops building, that is a platform we can no longer support, and it
      # should fail here rather than at release.
      - name: Cross-compile every target
        run: |
          for pair in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os="${pair%%/*}"; arch="${pair##*/}"
            GOOS="$os" GOARCH="$arch" go build -ldflags="-s -w" -o /tmp/inspect-"$os"-"$arch" ./cmd/inspect \
              || { echo "::error::$pair failed to build"; exit 1; }
            echo "  $pair ok"
          done
